<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2D 当前地图设计</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#151b23; --panel2:#1b222c; --line:#2b3542; --text:#dbe4ee; --muted:#8b98a6; --acc:#ffb84d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { padding:24px 28px 14px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; letter-spacing:0; }
  .sub { color:var(--muted); margin:6px 0 0; font-size:13px; }
  .wrap { max-width:1240px; margin:0 auto; padding:22px; }
  .tabs { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .tab { background:var(--panel2); border:1px solid var(--line); color:var(--text); padding:10px 16px; border-radius:8px; cursor:pointer; font-size:14px; }
  .tab.sel { border-color:var(--acc); color:var(--acc); }
  .layout { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(260px,0.8fr); gap:18px; }
  @media (max-width:900px) { .layout { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .panel-h { padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
  .canvas-box { padding:12px; }
  canvas { display:block; width:100%; height:auto; border-radius:6px; background:#0a0d12; }
  .info { padding:14px; }
  .metric { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .metric:last-child { border-bottom:0; }
  .metric b { font-variant-numeric:tabular-nums; }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:12px; }
  .lg { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  .sw { width:16px; height:16px; border-radius:4px; flex:0 0 auto; border:1px solid rgba(255,255,255,.14); }
  .ref { padding:12px; }
  .ref img { width:100%; border-radius:6px; background:#0a0d12; }
  .tag { color:var(--acc); font-size:12px; }
  .ok { color:#5fd68a; }
  .warn { color:#ffb84d; }
</style>
</head>
<body>
<header>
  <h1>CS2D 当前地图设计</h1>
  <p class="sub">官方 radar 高分辨率重建 · 120 列网格 · 每图 tile=16 · 上下层高台/坡道</p>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="layout">
    <div class="panel">
      <div class="panel-h"><span id="mapTitle"></span><span class="tag" id="mapSize"></span></div>
      <div class="canvas-box"><canvas id="mapCanvas" width="720" height="720"></canvas></div>
      <div class="panel-h"><span>官方 radar 对照</span></div>
      <div class="ref"><img id="radarImg" alt="official radar"></div>
    </div>
    <div class="panel">
      <div class="panel-h">关键指标</div>
      <div class="info">
        <div class="metric"><span>开放占比</span><b id="mOpen"></b></div>
        <div class="metric"><span>墙体 / 100 开放格</span><b id="mWall"></b></div>
        <div class="metric"><span>掩体 / 100 开放格</span><b id="mCover"></b></div>
        <div class="metric"><span>高台 / 坡道</span><b id="mVert"></b></div>
        <div class="metric"><span>T → A / CT → A</span><b id="mTA"></b></div>
        <div class="metric"><span>T → B / CT → B</span><b id="mTB"></b></div>
        <div class="metric"><span>A 点差</span><b id="mDiffA"></b></div>
        <div class="metric"><span>B 点差</span><b id="mDiffB"></b></div>
      </div>
      <div class="panel-h">图例</div>
      <div class="info">
        <div class="legend">
          <div class="lg"><span class="sw" style="background:#3a414d"></span>墙体</div>
          <div class="lg"><span class="sw" style="background:#9aa08c"></span>地面</div>
          <div class="lg"><span class="sw" style="background:#ff8a4d"></span>A 点</div>
          <div class="lg"><span class="sw" style="background:#5aa6ff"></span>B 点</div>
          <div class="lg"><span class="sw" style="background:#ffb84d"></span>T 出生</div>
          <div class="lg"><span class="sw" style="background:#4da6ff"></span>CT 出生</div>
          <div class="lg"><span class="sw" style="background:#7b8797"></span>高台</div>
          <div class="lg"><span class="sw" style="background:#6ad1a8"></span>坡道</div>
          <div class="lg"><span class="sw" style="background:#4d9fd6"></span>浅水</div>
          <div class="lg"><span class="sw" style="background:#173c63"></span>深水</div>
          <div class="lg"><span class="sw" style="background:#8a6a45"></span>箱子</div>
          <div class="lg"><span class="sw" style="background:#c2543a"></span>油桶</div>
        </div>
      </div>
    </div>
  </div>
</div>

const ids = Object.keys(MAPS);

const tabsEl = document.getElementById('tabs');
for (const id of ids) {
  const b = document.createElement('button');
  b.className = 'tab' + (id === current ? ' sel' : '');
  b.textContent = id;
  b.onclick = () => { current = id; render(); };
  tabsEl.appendChild(b);
}
function render() {
  const def = MAPS[current];
  const grid = def.rows.map((r) => r.split(''));
  const cv = document.getElementById('mapCanvas');
  const ctx = cv.getContext('2d');
  const cell = Math.min(Math.floor(cv.width / grid[0].length), Math.floor(cv.height / grid.length));
  cv.width = grid[0].length * cell;
  cv.height = grid.length * cell;
  ctx.fillStyle = '#0a0d12';
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      const c = grid[y][x];
      ctx.fillStyle = COLORS[c] || '#20262f';
      ctx.fillRect(x * cell, y * cell, cell, cell);
    }
  }
  document.getElementById('mapTitle').textContent = def.name + ' · ' + current;
  document.getElementById('mapSize').textContent = grid[0].length + ' × ' + grid.length + ' · tile ' + def.tile;

  document.getElementById('mDiffB').textContent = fmtDiff(m.timing.B.diff);
  for (const b of tabsEl.children) b.classList.toggle('sel', b.textContent === current);
}
