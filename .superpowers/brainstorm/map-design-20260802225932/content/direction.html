<h2>三张图采用哪种空间原型？</h2>
<p class="subtitle">只保留地图 id/名称，主题和结构都可重设计。先定空间骨架，再给每张图做差异化。</p>

    <div class="content">

      <p>T/CT 分区明确，A/B 分离，3 条清晰路线连接出生区与点位。路线清楚、防守站位和回防节奏最接近成熟爆破图。</p>

      <h3>枢纽争夺</h3>
      <p>地图中央是长期争夺的控制区，A/B 像卫星点分布在周围。差异化强，但对双方节奏和平衡要求更高。</p>
