# Nightly 重验证：CI 日常三关之外的重量级检查，每天跑一次，失败不影响 push CI。
# - balance-report：平衡采样（信息性，已知 forge/atrium 失衡期间不作为门禁，产物可下载）
# - cdp-perf：实机浏览器性能预算（首期观察运行，稳定后可转必过）
name: Nightly

on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC = 北京时间次日 05:00
  workflow_dispatch: {}

jobs:
  heavy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Full gates
        run: |
          npm run check
          npm run check:arch
          npm test
      - name: Balance sampling (informational)
        # 已知 forge/atrium 失衡（见 docs/balance-report），故不因退出码 1 而失败；产物留档看趋势
        run: |
          node scripts/map-balance.mjs --runs 8 | tee balance-report.txt || true
          cat balance-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: balance-report.txt
          retention-days: 30

  cdp-perf:
    runs-on: ubuntu-latest
    continue-on-error: true   # 首期观察：CI 环境的 headless Chrome 可用性/性能基线待确认
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install Chrome
        run: |
          sudo apt-get update && sudo apt-get install -y chromium-browser
      - name: Perf budget (headless)
        env:
          CDP_BROWSER: /usr/bin/chromium-browser
        run: node test/cdp-perf2d.mjs
