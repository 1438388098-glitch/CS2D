name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          # 零依赖项目无 lockfile，setup-node 的 npm 缓存会因缺 package-lock.json 直接报错
      - name: Syntax check
        run: npm run check
      - name: Architecture check (cycle guard)
        run: npm run check:arch
      - name: Unit + simulation tests
        run: npm test
      - name: Train smoke test
        run: node train/smoke-test.mjs
